<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GSN AI Inference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: sticky shop header + hash-routed views (首頁 / 模型 / Playground / 定價 / 控制台 / 文件) inside one 1200px column.
   Re-theme to gsnshop by editing these tokens only. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunken:#EAEEF3; --ink:#131923; --muted:#586274; --line:#D9DFE7;
  --accent:#BE2348; --accent-ink:#FFFFFF; --accent-soft:#FBE6EB;
  --d1:#BE2348; --d2:#2B67AC; --d3:#2C8A6A; --d4:#B07419; --d5:#7350B3;
  --ok:#2C8A6A; --warn:#B07419; --bad:#BE2348;
  --code-bg:#121821; --code-ink:#DCE3EC; --code-key:#F07C96; --code-str:#8FD3B4; --code-com:#7C8799;
  --font-display:"Bricolage Grotesque","Noto Sans TC",system-ui,sans-serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; --r-sm:6px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1118; --surface:#151B25; --sunken:#1B2330; --ink:#E5E9EF; --muted:#9AA3B3; --line:#263042;
  --accent:#F05A7C; --accent-ink:#1A0A10; --accent-soft:#3A1823;
  --d1:#F05A7C; --d2:#6AA5E6; --d3:#4EC29A; --d4:#E1A84B; --d5:#A88AE8;
  --ok:#4EC29A; --warn:#E1A84B; --bad:#F05A7C;
  --code-bg:#0A0E14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1118; --surface:#151B25; --sunken:#1B2330; --ink:#E5E9EF; --muted:#9AA3B3; --line:#263042;
  --accent:#F05A7C; --accent-ink:#1A0A10; --accent-soft:#3A1823;
  --d1:#F05A7C; --d2:#6AA5E6; --d3:#4EC29A; --d4:#E1A84B; --d5:#A88AE8;
  --ok:#4EC29A; --warn:#E1A84B; --bad:#F05A7C;
  --code-bg:#0A0E14; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--font-body);-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(1.9rem,4.4vw,3rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
.mono{font-family:var(--font-mono);font-size:.86em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:20px;height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 13px var(--font-display)}
.brand b{font-family:var(--font-display);font-size:1.05rem}
.brand small{display:block;font-size:.68rem;color:var(--muted);line-height:1}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.nav a{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--muted);white-space:nowrap;font-size:.92rem}
.nav a:hover{color:var(--ink);background:var(--sunken)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--sunken);font-weight:500}
.top-right{display:flex;align-items:center;gap:10px;flex:none}
.bal{font-family:var(--font-mono);font-size:.82rem;padding:5px 10px;border:1px solid var(--line);border-radius:999px;text-decoration:none;white-space:nowrap}
.bal i{font-style:normal;color:var(--muted)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:32px;height:32px;cursor:pointer;display:grid;place-items:center}

.wrap{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:32px 72px}
.view{display:grid;gap:40px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);cursor:pointer;text-decoration:none;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 12px;font-size:.86rem}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:20px}
.tag{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:999px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.tag.hot{background:var(--accent-soft);color:var(--accent)}
.tag.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.tag.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:middle}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.section-head p{max-width:62ch}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center}
.hero-copy{display:grid;gap:18px;min-width:0}
.hero-copy p.lead{font-size:1.08rem;color:var(--muted);max-width:52ch}
.hero-stats{display:flex;gap:28px;flex-wrap:wrap;padding-top:6px}
.hero-stats div b{display:block;font:700 1.4rem var(--font-display)}
.hero-stats div span{font-size:.8rem;color:var(--muted)}

.cluster{padding:18px;display:grid;gap:14px;min-width:0}
.cluster-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.gpu{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;display:grid;gap:10px;background:var(--bg)}
.gpu-top{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;flex-wrap:wrap}
.vram{display:flex;height:22px;border-radius:4px;overflow:hidden;background:var(--sunken)}
.vram span{display:block;height:100%;border-right:2px solid var(--bg)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.gpu-meter{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:.76rem;color:var(--muted)}
.gpu-meter b{display:block;color:var(--ink);font:600 .9rem var(--font-mono)}

.features{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.feature{display:grid;gap:6px;align-content:start}
.feature p{color:var(--muted);font-size:.93rem}

/* model cards */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.mcard{padding:18px;display:grid;gap:12px;align-content:start;text-decoration:none;transition:border-color .15s}
.mcard:hover{border-color:var(--accent)}
.mcard-top{display:flex;gap:10px;align-items:center}
.mlogo{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font:700 .8rem var(--font-mono);flex:none;color:#fff}
.mcard h3{font-size:1rem;word-break:break-word}
.mcard .org{font-size:.78rem;color:var(--muted)}
.mcard p.desc{font-size:.88rem;color:var(--muted);min-height:3.2em}
.mprice{display:flex;gap:18px;border-top:1px dashed var(--line);padding-top:10px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.mprice b{display:block;color:var(--ink);font:600 .95rem var(--font-mono)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.mach-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.76rem;color:var(--muted)}
.mach-row > span:first-child{margin-right:2px}
.mach{font:500 .72rem var(--font-mono);padding:2px 8px;border-radius:4px;border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.mach.live{border-color:color-mix(in srgb,var(--ok) 60%,transparent);color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.mach.no{color:var(--muted);text-decoration:line-through;opacity:.65}
.machines{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.machine{padding:18px;display:grid;gap:10px;align-content:start}
.machine dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:.86rem}
.machine dt{color:var(--muted)} .machine dd{margin:0}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 14px;border-radius:999px;cursor:pointer;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mgrid.fit{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
input[type=range],input[type=checkbox]{accent-color:var(--accent)}
.search{flex:1;min-width:180px;max-width:320px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}

/* code */
.code{background:var(--code-bg);color:var(--code-ink);border-radius:var(--r);overflow:hidden;min-width:0}
.code-tabs{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid #ffffff14;overflow-x:auto}
.code-tabs button{background:none;border:0;color:var(--code-com);padding:6px 12px;cursor:pointer;font:500 .8rem var(--font-mono);border-bottom:2px solid transparent}
.code-tabs button[aria-selected="true"]{color:var(--code-ink);border-bottom-color:var(--code-key)}
.code-tabs .copy{margin-left:auto}
.code pre{margin:0;padding:16px 18px;overflow-x:auto;font:13px/1.65 var(--font-mono)}
.code .k{color:var(--code-key)} .code .s{color:var(--code-str)} .code .c{color:var(--code-com)}
.split{display:grid;grid-template-columns:1fr 1.15fr;gap:32px;align-items:center}
.split > *{min-width:0}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:.8rem;background:var(--sunken)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td .sub{display:block;font-size:.76rem;color:var(--muted)}

/* pricing */
.packs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.pack{padding:20px;display:grid;gap:10px;align-content:start;cursor:pointer;text-align:left}
.pack[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pack .amt{font:700 1.8rem var(--font-display)}
.pack .bonus{font-size:.82rem;color:var(--ok);min-height:1.3em}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tier{padding:18px;display:grid;gap:8px;align-content:start}
.tier ul{margin:0;padding-left:18px;color:var(--muted);font-size:.88rem}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.field{display:grid;gap:6px}
.field label{font-size:.82rem;color:var(--muted)}
.field input,.field select,.field textarea{padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);width:100%}
.field input[type=range]{padding:0}
.calc-out{background:var(--sunken);border-radius:var(--r);padding:20px;display:grid;gap:10px;align-content:start}
.calc-out .big{font:700 2.2rem var(--font-display)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:.9rem}

/* playground */
.pg{display:grid;grid-template-columns:1fr 290px;gap:16px;align-items:start}
.pg > *{min-width:0}
.chat{display:grid;grid-template-rows:auto 1fr auto;min-height:560px}
.chat-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.msgs{padding:16px;display:grid;gap:14px;align-content:start;overflow-y:auto;max-height:520px}
.msg{display:grid;gap:4px;max-width:85%}
.msg .who{font-size:.72rem;color:var(--muted);font-family:var(--font-mono)}
.msg .bubble{padding:10px 14px;border-radius:12px;white-space:pre-wrap;word-break:break-word;font-size:.93rem}
.msg.user{justify-self:end}
.msg.user .bubble{background:var(--ink);color:var(--bg)}
.msg.assistant .bubble{background:var(--sunken)}
.msg .meta{font-size:.72rem;color:var(--muted);font-family:var(--font-mono)}
.compose{border-top:1px solid var(--line);padding:12px;display:grid;gap:8px}
.compose textarea{width:100%;resize:vertical;min-height:64px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg)}
.side{padding:16px;display:grid;gap:16px}
.side .field output{font-family:var(--font-mono);font-size:.8rem;color:var(--ink)}
.suggest{display:flex;gap:6px;flex-wrap:wrap}
.suggest button{font-size:.8rem;border:1px dashed var(--line);background:none;border-radius:999px;padding:3px 10px;cursor:pointer;color:var(--muted)}
.caret::after{content:"▍";animation:blink 1s steps(1) infinite;color:var(--accent)}
@keyframes blink{50%{opacity:0}}

/* dashboard */
.dash{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:start}
.dash > *{min-width:0}
.dnav{display:grid;gap:2px;position:sticky;top:80px}
.dnav button{text-align:left;padding:8px 12px;border:0;background:none;border-radius:var(--r-sm);cursor:pointer;color:var(--muted)}
.dnav button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:inset 0 0 0 1px var(--line)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{padding:16px;display:grid;gap:4px}
.stat b{font:700 1.5rem var(--font-display)}
.stat span{font-size:.8rem;color:var(--muted)}
.bar-track{height:6px;background:var(--sunken);border-radius:3px;overflow:hidden}
.bar-track i{display:block;height:100%;background:var(--accent)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--font-mono)}
.notice{padding:12px 14px;border-radius:var(--r-sm);background:var(--accent-soft);font-size:.88rem}
.keybox{font-family:var(--font-mono);font-size:.86rem;background:var(--sunken);padding:10px 12px;border-radius:var(--r-sm);word-break:break-all}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9rem;z-index:50;box-shadow:0 6px 24px #0003}
.docs{display:grid;grid-template-columns:200px 1fr;gap:32px}
.docs > *{min-width:0}
.docs article{display:grid;gap:16px;max-width:760px}
.docs article p,.docs article li{color:var(--muted)}
.docs article h2{margin-top:12px}
.foot{border-top:1px solid var(--line);padding-block:24px;font-size:.82rem;color:var(--muted)}
.foot-in{max-width:1200px;margin:0 auto;padding-inline:16px;display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}

@media (max-width:960px){
  .hero,.split,.calc{grid-template-columns:1fr}
  .packs,.tiers,.stats{grid-template-columns:repeat(2,1fr)}
  .machines{grid-template-columns:1fr}
  .pg,.dash,.docs{grid-template-columns:1fr}
  .dnav{position:static;display:flex;overflow-x:auto}
  .dnav button{white-space:nowrap}
  .features{grid-template-columns:1fr}
}
@media (max-width:560px){
  .packs,.tiers,.stats{grid-template-columns:1fr}
  .top-in{gap:10px}
  .brand small{display:none}
  .bal i{display:none}
  .msg{max-width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="brand" href="#home" aria-label="GSN AI 首頁">
      <span class="brand-mark">GSN</span>
      <span><b>GSN Shop</b><small>AI 推論服務</small></span>
    </a>
    <nav class="nav" id="nav" aria-label="主選單">
      <a href="#home">首頁</a>
      <a href="#models">模型</a>
      <a href="#playground">Playground</a>
      <a href="#pricing">定價</a>
      <a href="#dashboard">控制台</a>
      <a href="#docs">文件</a>
    </nav>
    <div class="top-right">
      <a class="bal num" href="#dashboard" id="balChip"><i>餘額 </i>$0.00</a>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="切換深淺色">◐</button>
    </div>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer class="foot">
  <div class="foot-in">
    <span>GSN Shop · AI 推論服務（示範介面，金流與 API 為模擬）</span>
    <span>OpenAI 相容 API · 運行於自有 2× H100 80GB + 1× RTX 5090 32GB</span>
  </div>
</footer>

<div class="toast" id="toast" hidden></div>

<script>
/* ---------- data ---------- */
// Prices are USD per 1M tokens unless unit says otherwise. See MODEL_PRICING_PLAN.md for capacity math.
const MODELS = [
  {id:"gpt-oss-120b", name:"gpt-oss-120b", org:"OpenAI · Apache-2.0", type:"llm", color:"var(--d1)", logo:"OA",

   ctx:"128K", in:0.15, cached:0.075, out:0.60, speed:190, gpu:"H100 #1", quant:"FP8", run:{h100:"live", r5090:"no"},
   tags:["繁體中文","RAG","高 CP 值"], hot:true},
  {id:"gpt-oss-20b", name:"gpt-oss-20b", org:"OpenAI · Apache-2.0", type:"llm", color:"var(--d1)", logo:"OA",
   desc:"21B MoE（啟用 3.6B），延遲最低、單價最便宜，適合分類、抽取與 Agent 子任務。",
   ctx:"32K", in:0.07, cached:0.035, out:0.30, speed:240, gpu:"RTX 5090", quant:"MXFP4", run:{h100:"ok", r5090:"live"},
   tags:["低延遲","最便宜"]},
  {id:"qwen2.5-vl-7b-instruct", name:"Qwen2.5-VL-7B-Instruct", org:"Alibaba Qwen · Apache-2.0", type:"vision", color:"var(--d5)", logo:"VL",
   desc:"圖片理解、OCR、表單與發票辨識。圖片依解析度換算為輸入 token。",
   ctx:"32K", in:0.20, cached:0.10, out:0.20, speed:150, gpu:"H100 #1", quant:"FP8", run:{h100:"live", r5090:"ok"},
   tags:["視覺","OCR"]},
  {id:"bge-m3", name:"BGE-M3", org:"BAAI · MIT", type:"embed", color:"var(--d3)", logo:"EM",

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd = (n, d=2) => "$" + Number(n).toLocaleString("en-US",{minimumFractionDigits:d, maximumFractionDigits:d});
const fmtRate = n => n == null ? "—" : "$" + (n < 0.1 ? n.toFixed(3) : n.toFixed(2));
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true, 2400); }
function copy(text){
  const done = () => toast("已複製");
  try{ navigator.clipboard.writeText(text).then(done, () => toast("請手動選取複製")); }catch(e){ toast("請手動選取複製"); }
}
// rough token estimate: CJK ≈ 1 token/char, latin ≈ 4 chars/token
function tokens(s){ const cjk=(s.match(/[\u3000-\u9fff\uff00-\uffef]/g)||[]).length; return Math.max(1, Math.round(cjk + (s.length-cjk)/4)); }

  return `<div><span>輸入 / 1M</span><b>${fmtRate(m.in)}</b></div><div><span>輸出 / 1M</span><b>${fmtRate(m.out)}</b></div><div><span>上下文</span><b>${m.ctx}</b></div>`;
}

function wireCode(root){
  root.querySelectorAll(".code").forEach(c=>{

      c.querySelectorAll("[data-lang]").forEach(x=>x.setAttribute("aria-selected", x===b));

    });
  });

function sendPg(text){
  const pg = state.pg; if(!text.trim() || pg.busy) return;
  if(state.balance <= 0){ toast("餘額不足，請先儲值"); location.hash="#dashboard"; return; }
  const m = MODELS.find(x=>x.id===pg.model);
  pg.msgs.push({role:"user", content:text});
  const reply = cannedReply(text, m);
  const msg = {role:"assistant", model:m.name, content:"", streaming:true};
  pg.msgs.push(msg); pg.busy = true; $("#pgSend").disabled = true;
  const inTok = tokens(pg.sys) + pg.msgs.filter(x=>x!==msg).reduce((a,x)=>a+tokens(x.content),0);
  const chars = [...reply]; let i = 0; const t0 = performance.now();
  const step = Math.max(1, Math.round(m.speed/40));
  renderPg();
  const timer = setInterval(()=>{
    i += step; msg.content = chars.slice(0,i).join("");
    if(i >= chars.length){
      clearInterval(timer);
      const outTok = tokens(reply), cost = (inTok*m.in + outTok*m.out)/1e6;
      msg.streaming = false;
      msg.meta = `${inTok} in · ${outTok} out · ${((performance.now()-t0)/1000).toFixed(1)}s · ${usd(cost,6)}`;
      pg.spent += cost; state.balance = Math.max(0, state.balance - cost); save(); updateBal();
      pg.busy = false; $("#pgSend").disabled = false;
    }
    renderPg();
  }, 25);
}

const DAYS = 14;
const USAGE = (()=>{ // deterministic demo series, USD per day per model
  const out=[]; let s=7;
  const rnd=()=>{ s=(s*9301+49297)%233280; return s/233280; };
  for(let d=0; d<DAYS; d++){
    const wk = [0.6,1,1,1,1,1,0.7][(d+3)%7];
    out.push({ "gpt-oss-120b": (0.9+rnd()*0.6)*wk*(1+d/30), "qwen3": (0.7+rnd()*0.5)*wk, "gpt-oss-20b": (0.2+rnd()*0.2)*wk, "其他": (0.1+rnd()*0.1)*wk });

})();
const SERIES = [["gpt-oss-120b","var(--d1)"],["qwen3","var(--d2)"],["gpt-oss-20b","var(--d4)"],["其他","var(--d3)"]];
function usageChart(){
  const W=720,H=220,pl=44,pr=10,pt=10,pb=26, iw=W-pl-pr, ih=H-pt-pb;
  const totals = USAGE.map(d=>Object.values(d).reduce((a,b)=>a+b,0));
  const max = Math.ceil(Math.max(...totals));
  const bw = iw/DAYS*0.62, gap = iw/DAYS;
  let g = "";
  for(let i=0;i<=4;i++){ const v=max*i/4, y=pt+ih-ih*i/4; g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${y+4}" text-anchor="end">$${v.toFixed(1)}</text>`; }
  USAGE.forEach((d,i)=>{
    let y = pt+ih; const x = pl+gap*i+(gap-bw)/2;
    SERIES.forEach(([k,c])=>{ const h=d[k]/max*ih; y-=h; g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${c}"><title>${k} ${usd(d[k])}</title></rect>`; });
    if(i%2===0 || i===DAYS-1){ const day = new Date(2026,9,8-(DAYS-1-i)); g+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${day.getMonth()+1}/${day.getDate()}</text>`; }
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="近 14 天每日花費，依模型堆疊">${g}</svg>`;
}

        <div class="tbl-wrap"><table><thead><tr><th>端點</th><th>用途</th><th>可用模型</th></tr></thead><tbody>
          <tr><td class="mono">POST /v1/chat/completions</td><td>對話、工具呼叫、圖片理解</td><td>gpt-oss-120b、gpt-oss-20b、Qwen3-30B、Qwen2.5-VL</td></tr>
          <tr><td class="mono">POST /v1/embeddings</td><td>向量嵌入</td><td>bge-m3</td></tr>
          <tr><td class="mono">POST /v1/rerank</td><td>重排序</td><td>bge-reranker-v2-m3</td></tr>
          <tr><td class="mono">POST /v1/audio/transcriptions</td><td>語音轉文字</td><td>whisper-large-v3-turbo</td></tr>
          <tr><td class="mono">POST /v1/batches</td><td>批次任務（5 折）</td><td>所有語言模型</td></tr>
          <tr><td class="mono">GET /v1/models</td><td>列出模型</td><td>—</td></tr>
        </tbody></table></div>
        <h2>4. 錯誤碼</h2>
        <div class="tbl-wrap"><table><thead><tr><th>狀態碼</th><th>原因</th><th>處理方式</th></tr></thead><tbody>
          <tr><td class="mono">401</td><td>金鑰錯誤或已撤銷</td><td>到控制台確認金鑰</td></tr>
          <tr><td class="mono">402</td><td>餘額不足</td><td>儲值後重試</td></tr>
          <tr><td class="mono">429</td><td>超出每分鐘請求或 token 上限</td><td>依 Retry-After 標頭稍後重試，或升級等級</td></tr>
          <tr><td class="mono">503</td><td>GPU 滿載</td><td>指數退避重試，或改用批次 API</td></tr>
        </tbody></table></div>
      </article>
    </div>
  </div>`;
}

/* ---------- router ---------- */
const ROUTES = {home:viewHome, models:viewModels, playground:viewPlayground, pricing:viewPricing, dashboard:viewDashboard, docs:viewDocs};
function updateBal(){ $("#balChip").innerHTML = `<i>餘額 </i>${usd(state.balance)}`; }
function route(){
  const r = (location.hash||"#home").slice(1);
  const name = ROUTES[r] ? r : "home";
  // swap in a fresh container so listeners from the previous view don't pile up
  const app = $("#app").cloneNode(false);
  $("#app").replaceWith(app);
  app.innerHTML = ROUTES[name]();
  document.querySelectorAll("#nav a").forEach(a=>{ if(a.getAttribute("href")!=="#"+name) a.removeAttribute("aria-current"); else a.setAttribute("aria-current","page"); });
  wireCode(app);
  if(name==="models") wireModels();
  if(name==="playground") wirePg();
  if(name==="pricing") wirePricing();
  if(name==="dashboard") wireDash();
  window.scrollTo(0,0);
}
function pickModelFromCard(e){
  const card = e.target.closest("[data-model]"); if(!card) return;
  const m = MODELS.find(x=>x.id===card.dataset.model);
  if(m && (m.type==="llm"||m.type==="vision")) state.pg.model = m.id;
}
function wireModels(){
  renderModelGrid();
  $("#app").addEventListener("click", e=>{
    const c = e.target.closest("[data-filter]");
    if(c){ state.filter=c.dataset.filter; document.querySelectorAll("[data-filter]").forEach(x=>x.setAttribute("aria-pressed", x===c)); renderModelGrid(); }
  });
  $("#modelSearch").addEventListener("input", e=>{ state.q=e.target.value; renderModelGrid(); });
  $("#machineFilter").addEventListener("change", e=>{ state.machine=e.target.value; renderModelGrid(); });
}
function wirePg(){
  renderPg();
  const input = $("#pgInput");
  const est = () => $("#pgEst").textContent = `約 ${tokens(input.value)} tokens`;
  input.addEventListener("input", est);
  input.addEventListener("keydown", e=>{ if(e.key==="Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); $("#compose").requestSubmit(); } });
  $("#compose").addEventListener("submit", e=>{ e.preventDefault(); const v=input.value; input.value=""; est(); sendPg(v); });
  $("#suggest").addEventListener("click", e=>{ const b=e.target.closest("button"); if(b) sendPg(b.textContent); });
  $("#pgModel").addEventListener("change", e=>{ state.pg.model=e.target.value; renderPg(); });
  $("#pgSys").addEventListener("input", e=>state.pg.sys=e.target.value);
  [["pgTemp","oTemp","temp"],["pgTopP","oTopP","topP"],["pgMax","oMax","max"]].forEach(([i,o,k])=>$("#"+i).addEventListener("input", e=>{ state.pg[k]=+e.target.value; $("#"+o).textContent=e.target.value; }));
  $("#pgClear").addEventListener("click", ()=>{ if(state.pg.busy) return; state.pg.msgs=[]; state.pg.spent=0; renderPg(); });
}
function wirePricing(){
  ["cModel","cReq","cIn","cOut","cCache"].forEach(id=>$("#"+id).addEventListener("input", renderCalc));
  renderCalc();
  $("#packs").addEventListener("click", e=>{ const b=e.target.closest("[data-pack]"); if(!b) return; state.pack=+b.dataset.pack; document.querySelectorAll("[data-pack]").forEach(x=>x.setAttribute("aria-pressed", x===b)); });
  $("#buyPack").addEventListener("click", ()=>{ state.dashTab="billing"; });
}
function wireDash(){
  renderDash();
  const app = $("#app");
  app.addEventListener("click", e=>{
    const tab = e.target.closest("[data-tab]");
    if(tab){ state.dashTab=tab.dataset.tab; renderDash(); return; }
    const go = e.target.closest("[data-goto]");
    if(go){ e.preventDefault(); state.dashTab=go.dataset.goto; renderDash(); return; }
    const pk = e.target.closest("[data-pack]");
    if(pk){ state.pack=+pk.dataset.pack; renderDash(); return; }
    const rv = e.target.closest("[data-revoke]");
    if(rv){ const cell = rv.parentElement; cell.innerHTML = `<span class="muted" style="font-size:.82rem">確定撤銷？</span> <button class="btn sm danger" type="button" data-confirm="${rv.dataset.revoke}">撤銷</button> <button class="btn sm" type="button" data-cancel>取消</button>`; return; }
    const cf = e.target.closest("[data-confirm]");
    if(cf){ state.keys = state.keys.filter(k=>k.id!==cf.dataset.confirm); save(); renderDash(); toast("金鑰已撤銷，使用它的請求會回傳 401"); return; }
    if(e.target.closest("[data-cancel]")){ renderDash(); return; }
    const cp = e.target.closest("[data-copykey]");
    if(cp){ copy(cp.dataset.copykey); }
  });
  app.addEventListener("submit", e=>{
    if(e.target.id==="keyForm"){
      e.preventDefault();
      const name = $("#keyName").value.trim(); if(!name) return;
      const hex = () => Array.from({length:32},()=>"0123456789abcdef"[Math.floor(Math.random()*16)]).join("");
      const full = "gsn-sk-" + hex() + hex().slice(0,16);
      state.keys.unshift({id:"k"+Date.now(), name, prefix: full.slice(0,11)+"…"+full.slice(-4), created:"2026-10-08", last:"尚未使用"});
      save(); renderDash();
      $("#newKey").innerHTML = `<div class="notice" style="display:grid;gap:8px"><b>請立即複製金鑰，關閉後將無法再次查看。</b><div class="keybox">${full}</div><div><button class="btn sm" type="button" data-copykey="${full}">複製金鑰</button></div></div>`;
    }
    if(e.target.id==="payForm"){
      e.preventDefault();
      const p = PACKS[state.pack], got = p.amt*(1+p.bonus/100);
      state.balance += got; save(); updateBal();
      const row = `<tr><td>2026-10-08</td><td>儲值 ${usd(p.amt,0)}${p.bonus?`（加贈 ${p.bonus}%）`:""}</td><td class="r mono">${usd(p.amt)}</td><td><span class="tag ok">已入帳</span></td></tr>`;
      renderDash(); $("#invoices").insertAdjacentHTML("afterbegin", row);
      toast(`已入帳 ${usd(got)}，目前餘額 ${usd(state.balance)}`);
    }
  });
}
document.addEventListener("click", pickModelFromCard);
$("#themeBtn").addEventListener("click", ()=>{
  const root=document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
});
window.addEventListener("hashchange", route);
updateBal(); route();
</script>
</body>
