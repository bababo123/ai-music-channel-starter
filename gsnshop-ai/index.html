<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GSN AI Inference</title>
<style>
/* Layout: GSN shop shell — top bar, left sidebar (existing shop items + AI Inference group), content column.
   Single dark theme to match gsnshop.amaryllo.us. Flow: browse table → add to cart → cart summary → payment → Order Summary. */
:root{
  --bg:#1C1D1F; --top:#2E2E30; --side:#38383A; --side-hover:#434345; --panel:#252628; --panel-2:#2C2D30; --line:#343538;
  --ink:#F2F2F3; --muted:#A4A4AA; --faint:#77777D;
  --active:#7C7FEA; --accent:#6366F1; --accent-hover:#7779F6; --accent-ink:#FFFFFF;
  --promo:#F0525B; --nexus:#E9B10A; --nv:#76B900; --ok:#3FBF7F; --warn:#E3A84A;
  --pill-bg:#E9E7FF; --pill-ink:#5848D6; --seg-bg:#2F3033;
  --d1:#F0587A; --d2:#6AA5E6; --d3:#4EC29A; --d4:#E1A84B; --d5:#A88AE8;
  --code-bg:#141518; --code-ink:#DCE3EC; --code-key:#A5A8FF; --code-str:#8FD3B4; --code-com:#7C8799;
  --font:"Helvetica Neue",Helvetica,Arial,"PingFang TC","Noto Sans TC",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--active);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:1.75rem;font-weight:700}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:54px;background:var(--top);display:flex;align-items:center;justify-content:space-between;padding-inline:24px 20px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.65rem;letter-spacing:.01em}
.logo svg{width:34px;height:34px}
.top-icons{display:flex;align-items:center;gap:16px}
.credit-chip{font-size:.8rem;padding:4px 10px;border:1px solid #4A4B4F;border-radius:999px;white-space:nowrap}
.credit-chip b{font-family:var(--mono);font-weight:600}
.icon-link{position:relative;display:grid;place-items:center;width:28px;height:28px}
.icon-link svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.6}
.badge{position:absolute;top:-5px;right:-6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#E5484D;color:#fff;font-size:.65rem;display:grid;place-items:center;font-weight:700}
.shell{display:grid;grid-template-columns:200px 1fr;min-height:calc(100% - 54px)}
.side{background:var(--side);align-self:start;position:sticky;top:calc(54px + env(safe-area-inset-top,0px))}
.side a{display:flex;align-items:center;gap:12px;height:50px;padding-inline:22px;font-size:.95rem;white-space:nowrap}
.side a:hover{background:var(--side-hover)}
.side a[aria-current="page"]{background:var(--active)}
.side a svg{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:1.4}
.side .group{padding:16px 22px 6px;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-top:1px solid #4A4A4D;background:var(--side)}
.side .new{margin-left:auto;font-size:.62rem;font-weight:700;letter-spacing:.06em;background:var(--accent);padding:1px 6px;border-radius:4px}
.main{padding:36px 32px 64px;min-width:0}
.page{display:grid;gap:24px;max-width:1700px}
.page-head{display:grid;gap:6px}
.page-head p{font-size:.95rem;color:#CFCFD3}

/* controls modelled on the shop */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.toggle{display:inline-flex;background:#fff;border-radius:3px;padding:2px;gap:2px}
.toggle button{border:0;background:transparent;color:#222;font-size:.75rem;padding:6px 9px;border-radius:2px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:#2B2C2F;color:#fff}
.seg-wrap{display:flex;align-items:center;gap:8px;font-size:.75rem;color:#CFCFD3}
.seg{display:inline-flex;background:var(--seg-bg);border-radius:4px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:1px solid transparent;background:transparent;color:#B8B8BD;font-size:.72rem;padding:5px 10px;border-radius:4px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:#C9A27A;color:#fff;background:#1F2023}
.search-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-inline:12px}
.search-row .label{font-size:.85rem;font-weight:500}
.search-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex:1;justify-content:flex-end;min-width:0}
.set-filters{position:relative}
.set-filters > button{background:#57585C;border:0;border-radius:4px;padding:6px 26px;font-size:.72rem;cursor:pointer}
.filter-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:10;background:var(--panel-2);border:1px solid #45464A;border-radius:6px;padding:14px;display:grid;gap:10px;min-width:220px;box-shadow:0 8px 28px #0007}
.filter-pop label{display:grid;gap:4px;font-size:.75rem;color:var(--muted)}
.filter-pop select{background:var(--bg);border:1px solid #45464A;border-radius:4px;padding:6px 8px}
.search{display:flex;align-items:center;gap:8px;border:1px solid #2A2B2E;background:#1A1B1D;border-radius:4px;padding:6px 10px;width:min(350px,100%)}
.search svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.search input{border:0;background:transparent;outline:0;font-size:.75rem;width:100%;min-width:0}
.active-filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-inline:12px;font-size:.8rem;color:#CFCFD3}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--pill-bg);color:var(--pill-ink);font-size:.7rem;padding:2px 9px;border-radius:999px;border:2px solid #C8C3FF}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}

/* tables */
.tbl-wrap{overflow-x:auto;padding-inline:12px}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th{font-weight:500;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:.75rem}
td{padding:14px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle;color:#DADADE}
tr:last-child td{border-bottom:0}
.r{text-align:right}
.prod{display:flex;align-items:center;gap:10px}
.prod b{font-weight:500;color:var(--ink);line-height:1.35}
.prod small{display:block;color:var(--faint);font-size:.7rem}
.nv{width:24px;height:16px;flex:none}
.mlogo{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font:700 .62rem var(--mono);color:#111;flex:none}
.nexus{font:800 .78rem/1 "Arial Narrow",Arial,sans-serif;letter-spacing:.02em;color:var(--nexus);transform:scaleY(1.15);display:inline-block}
.strike{text-decoration:line-through;color:#DADADE;font-weight:600}
.promo{color:var(--promo)}
.cart-btn{width:30px;height:30px;border-radius:4px;border:0;background:var(--accent);display:grid;place-items:center;cursor:pointer}
.cart-btn:hover{background:var(--accent-hover)}
.cart-btn svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2}
.cart-btn[disabled]{opacity:.35;cursor:not-allowed}
.cart-btn.added{background:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:4px;border:1px solid #4A4B4F;background:transparent;padding:7px 14px;font-size:.78rem;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#77787D}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.block{width:100%;padding:11px}
.btn.sm{padding:4px 10px;font-size:.72rem}
.btn.danger{color:var(--promo);border-color:#6B3036}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.mach{font:500 .68rem var(--mono);padding:1px 7px;border-radius:3px;border:1px solid #4A4B4F;color:#CFCFD3;white-space:nowrap}
.mach.live{border-color:#2F7D57;color:var(--ok);background:#1E3328}
.mach.no{color:var(--faint);text-decoration:line-through;border-style:dashed}
.machs{display:flex;gap:5px}
.tag{font-size:.68rem;padding:1px 7px;border-radius:3px;background:#2F3033;color:#CFCFD3;white-space:nowrap}
.tag.ok{background:#1E3328;color:var(--ok)} .tag.warn{background:#3A2E1A;color:var(--warn)} .tag.bad{background:#3A1E22;color:var(--promo)}
.note{font-size:.75rem;color:var(--muted);padding-inline:12px;max-width:90ch}

/* hardware strip */
.hw{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding-inline:12px}
.hw-card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:10px;min-width:0}
.hw-head{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.vram{display:flex;height:10px;border-radius:2px;overflow:hidden;background:#333438}
.vram span{display:block;height:100%;border-right:2px solid var(--panel)}
.legend{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:.7rem;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.hw dl{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0;font-size:.76rem}
.hw dt{color:var(--faint)} .hw dd{margin:0;color:#DADADE;min-width:0}

/* cart */
.cart{display:grid;grid-template-columns:1fr 280px;gap:48px;align-items:start}
.cart > *{min-width:0}
.cart-items{display:grid;gap:0}
.clear{justify-self:end;display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--promo);background:none;border:0;cursor:pointer;padding:6px 0}
.clear svg{width:14px;height:14px;stroke:var(--promo);fill:none;stroke-width:1.8}
.citem{display:grid;grid-template-columns:1fr auto auto;gap:16px 24px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}
.citem-specs{display:flex;gap:28px;flex-wrap:wrap;font-size:.78rem;margin-top:12px}
.citem-specs span{display:grid;gap:2px}
.citem-specs b{font-weight:500}
.citem-specs i{font-style:normal;color:var(--muted)}
.loc{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;color:#CFCFD3;margin-left:18px}
.loc svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.stepper{display:inline-flex;align-items:center;border:1px solid #3E3F43;border-radius:3px}
.stepper button{width:28px;height:28px;border:0;background:none;cursor:pointer;font-size:1rem}
.stepper span{min-width:28px;text-align:center;font-size:.78rem}
.summary{display:grid;gap:14px;font-size:.78rem}
.summary .line{display:grid;grid-template-columns:1fr auto auto;gap:14px;color:var(--muted);padding-bottom:12px;border-bottom:1px solid var(--line)}
.summary .total{display:flex;justify-content:space-between;align-items:baseline;font-size:.95rem;gap:12px}
.summary .total b{color:var(--active);font-weight:500}
.summary p.fine{font-size:.72rem;color:var(--muted);line-height:1.6}
.pay{display:grid;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px}
.field{display:grid;gap:4px}
.field label{font-size:.72rem;color:var(--muted)}
.field input,.field select,.field textarea{background:#1A1B1D;border:1px solid #3A3B3F;border-radius:4px;padding:8px 10px;width:100%;font-size:.8rem}
.empty{padding:48px 12px;color:var(--muted);display:grid;gap:12px;justify-items:start}

/* panels */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding-inline:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:grid;gap:2px}
.stat span{font-size:.72rem;color:var(--muted)}
.stat b{font-size:1.35rem;font-weight:600}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:12px;margin-inline:12px;min-width:0}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:10px var(--mono)}
.keybox{font-family:var(--mono);font-size:.8rem;background:#1A1B1D;border:1px solid #3A3B3F;padding:9px 11px;border-radius:4px;word-break:break-all}
.notice{background:#26264A;border:1px solid #4648A8;border-radius:6px;padding:12px 14px;font-size:.8rem;display:grid;gap:8px}

/* playground */
.pg{display:grid;grid-template-columns:1fr 280px;gap:14px;padding-inline:12px;align-items:start}
.pg > *{min-width:0}
.chat{background:var(--panel);border:1px solid var(--line);border-radius:6px;display:grid;grid-template-rows:auto 1fr auto;min-height:520px}
.chat-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;font-size:.8rem}
.msgs{padding:14px;display:grid;gap:12px;align-content:start;overflow-y:auto;max-height:480px}
.msg{display:grid;gap:3px;max-width:85%}
.msg .who{font:.68rem var(--mono);color:var(--faint)}
.msg .bubble{padding:9px 12px;border-radius:8px;white-space:pre-wrap;word-break:break-word;font-size:.85rem;background:#333438}
.msg.user{justify-self:end}
.msg.user .bubble{background:var(--accent)}
.msg .meta{font:.68rem var(--mono);color:var(--faint)}
.compose{border-top:1px solid var(--line);padding:10px;display:grid;gap:8px}
.compose textarea{background:#1A1B1D;border:1px solid #3A3B3F;border-radius:4px;padding:8px 10px;resize:vertical;min-height:56px;font-size:.85rem}
.suggest{display:flex;gap:6px;flex-wrap:wrap}
.suggest button{font-size:.7rem;border:1px dashed #4A4B4F;background:none;border-radius:999px;padding:2px 9px;cursor:pointer;color:var(--muted)}
.params{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:grid;gap:14px}
.params output{font-family:var(--mono);font-size:.72rem;color:var(--ink)}
input[type=range]{accent-color:var(--accent);padding:0!important;border:0!important;background:none!important}
.caret::after{content:"▍";animation:blink 1s steps(1) infinite;color:var(--active)}
@keyframes blink{50%{opacity:0}}

/* code */
.code{background:var(--code-bg);color:var(--code-ink);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:0}
.code-tabs{display:flex;gap:2px;padding:6px 6px 0;border-bottom:1px solid #ffffff14;overflow-x:auto}
.code-tabs button{background:none;border:0;color:var(--code-com);padding:6px 11px;cursor:pointer;font:500 .74rem var(--mono);border-bottom:2px solid transparent}
.code-tabs button[aria-selected="true"]{color:var(--code-ink);border-bottom-color:var(--code-key)}
.code-tabs .copy{margin-left:auto}
.code pre{margin:0;padding:14px 16px;overflow-x:auto;font:12.5px/1.65 var(--mono)}
.code .k{color:var(--code-key)} .code .s{color:var(--code-str)} .code .c{color:var(--code-com)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-inline:12px}
.two > *{min-width:0}
.two .box{margin-inline:0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#F2F2F3;color:#1C1D1F;padding:9px 16px;border-radius:999px;font-size:.82rem;z-index:50;box-shadow:0 6px 24px #0008}

@media (max-width:1000px){
  .cart,.pg,.two{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .hw{grid-template-columns:1fr}
}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:calc(54px + env(safe-area-inset-top,0px));z-index:20;display:flex;overflow-x:auto;scrollbar-width:none}
  .side a{height:44px;padding-inline:14px;font-size:.82rem}
  .side a svg{width:18px;height:18px}
  .side .group{display:none}
  .side .new{display:none}
  .main{padding:24px 16px 56px}
  .top{padding-inline:16px}
  .credit-chip span{display:none}
  .search-row,.active-filters,.tbl-wrap,.note,.hw,.stats,.pg,.two{padding-inline:0}
  .box{margin-inline:0}
  .citem{grid-template-columns:1fr auto}
  .citem .cprice{grid-column:1}
}
@media (max-width:480px){ .stats{grid-template-columns:1fr} .msg{max-width:100%} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <a class="logo" href="#reserve" aria-label="GSN home">
    <svg viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke-linejoin="round" stroke-width="2.4"><path d="M20 6 35 13 20 20 5 13Z" stroke="#7C7FEA"/><path d="M5 19.5 20 26.5 35 19.5" stroke="#6366F1"/><path d="M5 26 20 33 35 26" stroke="#4F52D8"/></g></svg>
    GSN
  </a>
  <div class="top-icons">
    <a class="credit-chip num" href="#usage" id="creditChip"><span>AI Credits </span><b>$0.00</b></a>
    <a class="icon-link" href="#cart" aria-label="Cart"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1.2 12H6.2Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="badge" id="cartBadge" hidden>0</span></a>
    <a class="icon-link" href="#orders" aria-label="Account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></a>
  </div>
</header>

<div class="shell">
  <nav class="side" id="side" aria-label="Main">
    <a href="#reserve"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 14h18M7 17h2"/></svg>Reserve Instances</a>
    <a href="#vms"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 15a3 3 0 0 1 .5-5.9A4 4 0 0 1 16 10a2.5 2.5 0 0 1 0 5Z"/><path d="M2 9h2M2 15h2M20 9h2M20 15h2"/></svg>Access VMs</a>
    <a href="#orders"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M8 10h8M8 14h8M8 18h5"/></svg>Order Summary</a>
    <div class="group">AI Inference</div>
    <a href="#models"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 7l3 3M17 7l-3 3M7 17l3-3M17 17l-3-3"/></svg>AI Models<span class="new">NEW</span></a>
    <a href="#credits"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>Buy Credits</a>
    <a href="#playground"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4Z"/><path d="M8 9h8M8 12h5"/></svg>Playground</a>
    <a href="#keys"><svg viewBox="0 0 24 24"><circle cx="8" cy="14" r="4"/><path d="M11 11l9-9M17 5l2 2M15 7l2 2"/></svg>API Keys</a>
    <a href="#usage"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Usage</a>
  </nav>
  <main class="main" id="app"></main>
</div>

<div class="toast" id="toast" hidden></div>

<script>
/* ---------- data ---------- */
const NV = `<svg class="nv" viewBox="0 0 24 16" aria-hidden="true"><path fill="var(--nv)" d="M9 3.2C5 3.4 2 6.4 1 8c1 1.6 4.2 4.8 8.6 4.8V11C6.5 11 4.3 9.3 3.4 8c.9-1.3 3-3 5.6-3.1V3.2Z"/><path fill="var(--nv)" d="M9 1v2.2c.2 0 .4 0 .6 0 4 0 7.2 2.6 8.6 4.8-1.4 2-4.6 4.8-8.6 4.8V15H23V1Zm.6 5.4c-1 0-1.8.7-1.8 1.6s.8 1.6 1.8 1.6V6.4Z"/></svg>`;
// Existing shop catalogue (from the live Reserve Instances page), monthly prices in USD.
const INSTANCES = [

function renderPg(){
  const pg=state.pg, m=MODELS.find(x=>x.id===pg.model);
  $("#pgName").textContent=m.name; $("#pgSpeed").textContent=`~${m.speed} tok/s`;
  $("#pgMach").innerHTML=machChips(m);
  $("#pgPrice").innerHTML=`in ${rate(m.in)} · cached ${rate(m.cached)} · out ${rate(m.out)}`;
  $("#pgSpent").textContent=usd(pg.spent,5);
  const box=$("#msgs");
  box.innerHTML = pg.msgs.length ? pg.msgs.map(x=>`<div class="msg ${x.role}"><span class="who">${x.role==="user"?"You":esc(x.model)}</span><div class="bubble${x.streaming?" caret":""}">${esc(x.content)}</div>${x.meta?`<span class="meta num">${x.meta}</span>`:""}</div>`).join("")
    : `<p class="muted" style="text-align:center;padding:28px 0;font-size:.82rem">Pick a model and send a message. A typical reply costs less than $0.001.</p>`;
  box.scrollTop=box.scrollHeight;
}
function sendPg(text){
  const pg=state.pg; if(!text.trim()||pg.busy) return;
  if(state.balance<=0){ toast("Out of credits. Buy AI Credits to continue."); location.hash="#credits"; return; }
  const m=MODELS.find(x=>x.id===pg.model);
  pg.msgs.push({role:"user", content:text});
  const reply=(CANNED.find(c=>c.k.test(text))||{}).a || `(Demo reply) This is ${m.name}, served on ${m.gpu}. Once connected to the live API, the model's real output streams here.\n\nYour message was about ${tokens(text)} tokens.`;
  const msg={role:"assistant", model:m.name, content:"", streaming:true}; pg.msgs.push(msg); pg.busy=true; $("#pgSend").disabled=true;
  const inTok=tokens(pg.sys)+pg.msgs.filter(x=>x!==msg).reduce((a,x)=>a+tokens(x.content),0);
  const chars=[...reply]; let i=0; const t0=performance.now(), step=Math.max(1,Math.round(m.speed/40));
  renderPg();
  const timer=setInterval(()=>{
    i+=step; msg.content=chars.slice(0,i).join("");
    if(i>=chars.length){
      clearInterval(timer);
      const outTok=tokens(reply), cost=(inTok*m.in+outTok*m.out)/1e6;
      msg.streaming=false; msg.meta=`${inTok} in · ${outTok} out · ${((performance.now()-t0)/1000).toFixed(1)}s · ${usd(cost,6)} · ${m.gpu}`;
      pg.spent+=cost; state.balance=Math.max(0,state.balance-cost); save(); updateChrome(); pg.busy=false;
      const s=$("#pgSend"); if(s) s.disabled=false;
    }
    if($("#msgs")) renderPg(); else if(i>=chars.length) clearInterval(timer);
  },25);
}

const DAYS=14;
const USAGE=(()=>{ const out=[]; let s=7; const r=()=>{ s=(s*9301+49297)%233280; return s/233280; };
  for(let d=0; d<DAYS; d++){ const w=[0.6,1,1,1,1,1,0.7][(d+3)%7]; out.push({"gpt-oss-120b":(0.9+r()*0.6)*w*(1+d/30),"Qwen3-30B":(0.7+r()*0.5)*w,"gpt-oss-20b":(0.2+r()*0.2)*w,"Other":(0.1+r()*0.1)*w}); } return out; })();
const SERIES=[["gpt-oss-120b","var(--d1)"],["Qwen3-30B","var(--d2)"],["gpt-oss-20b","#C2669A"],["Other","var(--d3)"]];
function usageChart(){
  const W=720,H=210,pl=42,pr=8,pt=8,pb=24,iw=W-pl-pr,ih=H-pt-pb;
  const max=Math.ceil(Math.max(...USAGE.map(d=>Object.values(d).reduce((a,b)=>a+b,0))));
  const gap=iw/DAYS, bw=gap*.62; let g="";
  for(let i=0;i<=4;i++){ const y=pt+ih-ih*i/4; g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-6}" y="${y+3}" text-anchor="end">$${(max*i/4).toFixed(1)}</text>`; }
  USAGE.forEach((d,i)=>{ let y=pt+ih; const x=pl+gap*i+(gap-bw)/2;
    SERIES.forEach(([k,c])=>{ const h=d[k]/max*ih; y-=h; g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${c}"><title>${k} ${usd(d[k])}</title></rect>`; });
    if(i%2===0||i===DAYS-1){ const day=new Date(2026,9,8-(DAYS-1-i)); g+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-7}" text-anchor="middle">${day.getMonth()+1}/${day.getDate()}</text>`; } });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily AI spend, last 14 days, stacked by model">${g}</svg>`;
}

    ["14:31:40","rag-indexer","bge-m3",7944,0,200],["14:30:12","production-chatbot","gpt-oss-120b",1580,0,429],["14:29:48","production-chatbot","gpt-oss-20b",420,38,200]];

    </div>
    <div class="box chart"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h3>Daily spend, last 14 days</h3><div class="legend">${SERIES.map(([k,c])=>`<span><i style="background:${c}"></i>${k}</span>`).join("")}</div></div>${usageChart()}</div>
    <div class="tbl-wrap"><table class="num"><thead><tr><th>Time</th><th>Key</th><th>Model</th><th>Machine</th><th class="r">Input</th><th class="r">Output</th><th>Status</th><th class="r">Cost</th></tr></thead><tbody>

    </tbody></table></div>
  </div>`;
}

/* ---------- router & events ---------- */
const ROUTES={reserve:pageReserve, vms:pageVMs, orders:pageOrders, models:pageModels, credits:pageCredits, playground:pagePlayground, keys:pageKeys, usage:pageUsage, cart:pageCart};
let current="reserve";
function render(){
  const app=$("#app"); app.innerHTML=ROUTES[current]();
  document.querySelectorAll("#side a").forEach(a=>{ if(a.getAttribute("href")==="#"+current) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  if(current==="models") renderModelRows();
  if(current==="playground") wirePg();
  updateChrome();
}
function route(){ const r=(location.hash||"#reserve").slice(1); current=ROUTES[r]?r:"reserve"; if(current!=="cart") state.checkout=false; render(); window.scrollTo(0,0); }

const app=$("#app");
app.addEventListener("click", e=>{
  const t=e.target, q=s=>t.closest(s);
  let b;
  if(b=q("[data-billing]")){ state.billing=b.dataset.billing; render(); }
  else if(b=q("[data-plan]")){ state.creditPlan=b.dataset.plan; render(); }
  else if(b=q("[data-add-inst]")){ const x=INSTANCES.find(i=>i.id===b.dataset.addInst);
    addToCart({id:x.id, kind:"instance", name:x.name, price:x.price, period:"month", specs:[["RAM",x.ram],["DISK",x.disk],["VCPUS",x.vcpu]]}); render(); }
  else if(b=q("[data-add-pack]")){ const p=PACKS.find(i=>i.id===b.dataset.addPack), m=state.creditPlan==="monthly", v=packValue(p,state.creditPlan);
    addToCart({id:p.id+(m?"-m":""), kind:"credit", name:p.name+(m?" (Monthly)":""), price:p.pay, credit:v, period:m?"month":null,
      specs:[["CREDIT",usd(v)],["BONUS",(p.bonus+(m?MONTHLY_EXTRA:0))+"%"],["VALID","12 months"],["BILLING",m?"Monthly":"One-time"]]}); render(); }
  else if(b=q("[data-mtype]")){ state.mType=b.dataset.mtype; render(); }
  else if(b=q("#setFilters")){ state.showFilters=!state.showFilters; $("#filterPop").hidden=!state.showFilters; b.setAttribute("aria-expanded",state.showFilters); }
  else if(b=q("#resetFilters")){ state.mType="all"; state.mMachine="all"; state.mQuery=""; state.showFilters=false; render(); }
  else if(b=q("[data-try]")){ state.pg.model=b.dataset.try; }
  else if(b=q("[data-inc]")){ state.cart.find(i=>i.id===b.dataset.inc).qty++; save(); render(); }
  else if(b=q("[data-dec]")){ const it=state.cart.find(i=>i.id===b.dataset.dec); it.qty--; if(!it.qty) state.cart=state.cart.filter(i=>i!==it); save(); render(); }
  else if(b=q("#clearCart")){ state.cart=[]; state.checkout=false; save(); render(); }
  else if(b=q("#continue")){
    const total=state.cart.reduce((a,i)=>a+i.price*i.qty,0);
    if(total>CARD_LIMIT){ placeOrder("Wire transfer","Pending"); toast("Request sent. We'll email wire transfer details."); }
    else { state.checkout=true; render(); $("#payName")?.focus(); }
  }
  else if(b=q("[data-revoke]")){ b.parentElement.innerHTML=`<span class="muted" style="font-size:.72rem">Revoke this key?</span> <button class="btn sm danger" type="button" data-confirm="${b.dataset.revoke}">Revoke</button> <button class="btn sm" type="button" data-cancel>Cancel</button>`; }
  else if(b=q("[data-confirm]")){ state.keys=state.keys.filter(k=>k.id!==b.dataset.confirm); save(); render(); toast("Key revoked. Requests using it now return 401."); }
  else if(q("[data-cancel]")){ render(); }
  else if(b=q("[data-copykey]")){ copy(b.dataset.copykey); }
  else if(b=q("[data-copycode]")){ const p=[...b.closest(".code").querySelectorAll("pre")].find(p=>!p.hidden); copy(p.textContent); }
  else if(b=q("[data-lang]")){ const c=b.closest(".code"); c.querySelectorAll("[data-lang]").forEach(x=>x.setAttribute("aria-selected",x===b)); c.querySelectorAll("pre").forEach(p=>p.hidden=p.dataset.pane!==b.dataset.lang); }
});
app.addEventListener("input", e=>{
  if(e.target.id==="mSearch"){ state.mQuery=e.target.value; renderModelRows(); }
});
app.addEventListener("change", e=>{
  if(e.target.id==="fMachine"){ state.mMachine=e.target.value; render(); }
});
app.addEventListener("submit", e=>{
  e.preventDefault();
  if(e.target.id==="payForm"){ placeOrder($("#payMethod").value, "Paid"); toast("Payment received. AI Credits added."); }
  if(e.target.id==="keyForm"){
    const name=$("#keyName").value.trim(); if(!name) return;
    const hex=n=>Array.from({length:n},()=>"0123456789abcdef"[Math.floor(Math.random()*16)]).join("");
    const full="gsn-sk-"+hex(48);
    state.keys.unshift({id:"k"+Date.now(), name, prefix:full.slice(0,11)+"…"+full.slice(-4), created:"2026-10-08", last:"Never"}); save(); render();
    $("#newKey").innerHTML=`<div class="notice"><b>Copy this key now. You won't be able to see it again.</b><div class="keybox">${full}</div><div><button class="btn sm" type="button" data-copykey="${full}">Copy key</button></div></div>`;
  }
});
function placeOrder(method, status){
  const total=state.cart.reduce((a,i)=>a+i.price*i.qty,0);
  const id="GSN-"+new Date().toISOString().slice(2,10).replace(/-/g,"")+"-"+String(Math.floor(Math.random()*9000)+1000);
  state.orders.unshift({id, date:"2026-10-08", items:state.cart.map(i=>({name:i.name, qty:i.qty, price:i.price, credit:i.credit})), total, method, status});
  if(status==="Paid") state.balance+=state.cart.filter(i=>i.kind==="credit").reduce((a,i)=>a+i.credit*i.qty,0);
  state.cart=[]; state.checkout=false; save(); location.hash="#orders";
}
function wirePg(){
  renderPg();
  const input=$("#pgInput"), est=()=>$("#pgEst").textContent=`~${tokens(input.value)} tokens`;
  input.addEventListener("input",est);
  input.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); $("#compose").requestSubmit(); } });
  $("#compose").addEventListener("submit",e=>{ e.preventDefault(); e.stopPropagation(); const v=input.value; input.value=""; est(); sendPg(v); });
  $("#suggest").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) sendPg(b.textContent); });
  $("#pgModel").addEventListener("change",e=>{ state.pg.model=e.target.value; renderPg(); });
  $("#pgSys").addEventListener("input",e=>state.pg.sys=e.target.value);
  [["pgTemp","oTemp","temp"],["pgMax","oMax","max"]].forEach(([i,o,k])=>$("#"+i).addEventListener("input",e=>{ state.pg[k]=+e.target.value; $("#"+o).textContent=e.target.value; }));
  $("#pgClear").addEventListener("click",()=>{ if(state.pg.busy) return; state.pg.msgs=[]; state.pg.spent=0; renderPg(); });
}
window.addEventListener("hashchange", route);
route();
</script>
